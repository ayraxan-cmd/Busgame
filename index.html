<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF MAX - VIP Diamond & Gift Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(180deg, #131822 0%, #090c10 100%);
            border-left: 1px solid #222b3a;
            border-right: 1px solid #222b3a;
            padding: 15px;
            padding-bottom: 90px;
            position: relative;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18202c;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #2c384b;
            margin-bottom: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background: #ff2a2a;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            animation: pulse 1.5s infinite;
        }

        .brand h1 {
            font-size: 20px;
            letter-spacing: 1px;
            color: #f39c12;
        }

        .diamond-box {
            background: #0d1219;
            border: 1px solid #3498db;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: bold;
            color: #5dade2;
        }

        /* UID Search Box */
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-section input {
            flex: 1;
            background: #1a222f;
            border: 1px solid #324056;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            letter-spacing: 1px;
        }

        .search-section input:focus {
            border-color: #f39c12;
        }

        .search-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: none;
            border-radius: 8px;
            padding: 0 22px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:active {
            transform: scale(0.96);
        }

        /* Player Info Status */
        .player-status {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            justify-content: space-between;
        }

        /* Marquee Notice */
        .notice-bar {
            background: #18202c;
            border-top: 1px solid #f39c12;
            border-bottom: 1px solid #f39c12;
            padding: 6px 0;
            margin-bottom: 15px;
            font-size: 14px;
            color: #f1c40f;
            overflow: hidden;
            white-space: nowrap;
        }

        .notice-text {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }

        /* Section Title */
        .store-title {
            text-align: center;
            background: linear-gradient(90deg, transparent, #1f2938, transparent);
            padding: 10px;
            margin-bottom: 15px;
            border-top: 1px solid #34495e;
            border-bottom: 1px solid #34495e;
            color: #5dade2;
            font-size: 18px;
            letter-spacing: 1.5px;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item-card {
            background: linear-gradient(180deg, #1d2636 0%, #121722 100%);
            border: 1px solid #2d3b52;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .item-card.rare {
            border: 1px solid #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.2);
        }

        .item-card.selected {
            border: 2px solid #2ecc71;
            background: linear-gradient(180deg, #1e3a2f 0%, #121722 100%);
            transform: translateY(-2px);
        }

        .rare-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #e74c3c;
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
            z-index: 2;
        }

        .item-img-box {
            width: 100%;
            height: 80px;
            background: #0f141d;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .item-img-box img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .item-name {
            font-size: 11px;
            color: #ecf0f1;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-price {
            font-size: 13px;
            font-weight: bold;
            color: #f39c12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        /* Bottom Action Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #131822;
            border-top: 1px solid #2c384b;
            padding: 12px 15px;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .send-btn {
            width: 100%;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            padding: 14px;
            border-radius: 8px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }

        .send-btn:disabled {
            background: #34495e;
            color: #7f8c8d;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: #18202c;
            border: 2px solid #f39c12;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 22px;
            color: #2ecc71;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 15px;
            color: #bdc3c7;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .close-modal {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <span class="live-badge">LIVE</span>
            <h1>FF MAX</h1>
        </div>
        <div class="diamond-box">
            💎 <span id="total-diamonds">82,140,765</span>
        </div>
    </div>

    <!-- UID Input -->
    <div class="search-section">
        <input type="number" id="uid-input" placeholder="Enter Player UID (e.g. 3895666289)">
        <button class="search-btn" onclick="searchPlayer()">SEARCH</button>
    </div>

    <!-- Player Found Status -->
    <div class="player-status" id="player-status">
        <span>✔ Player Found: <strong id="player-name">VIP_GAMER_BD</strong></span>
        <span>Lvl: 74</span>
    </div>

    <!-- Scrolling Notice -->
    <div class="notice-bar">
        <div class="notice-text">🔥 VIP Members Live Gift Store — Select Rare Bundle or Emote & Click Send Gift Now! 🔥</div>
    </div>

    <!-- Store Title -->
    <div class="store-title">💎 VIP RARE ITEMS STORE 💎</div>

    <!-- Items Grid (Real Images) -->
    <div class="items-grid" id="items-grid"></div>

    <!-- Bottom Fixed Button -->
    <div class="bottom-bar">
        <button class="send-btn" id="send-btn" onclick="sendGift()" disabled>SELECT AN ITEM FIRST</button>
    </div>
</div>

<!-- Success Popup Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🎉</div>
        <h2 class="modal-title">GIFT SENT SUCCESSFULLY!</h2>
        <p class="modal-desc" id="modal-message"></p>
        <button class="close-modal" onclick="closeModal()">OKAY</button>
    </div>
</div>

<script>
    // ফ্রি ফায়ার অফিশিয়াল ও রিয়েল আইটেম ইমেজ লিংকসহ ডেটা
    const storeItems = [
        { id: 1, name: "Hip-Hop Bundle", price: 3999, img: "https://ff.garena.com/common/ckt/images/common/item_hiphop.png", fallback: "🧢", rare: true },
        { id: 2, name: "Green Criminal", price: 3699, img: "https://vignette.wikia.nocookie.net/freefire/images/b/b5/Green_Criminal_Bundle.png", fallback: "🤡", rare: true },
        { id: 3, name: "Sakura Bundle", price: 3499, img: "https://vignette.wikia.nocookie.net/freefire/images/5/52/Sakura_Bundle.png", fallback: "👹", rare: true },
        { id: 4, name: "Cobra MP40 Max", price: 2999, img: "https://vignette.wikia.nocookie.net/freefire/images/3/36/Cobra_MP40.png", fallback: "🐍", rare: true },
        { id: 5, name: "Pirate Flag Emote", price: 2499, img: "https://vignette.wikia.nocookie.net/freefire/images/8/87/Pirate_Flag.png", fallback: "🏴‍☠️", rare: true },
        { id: 6, name: "LOL Emote", price: 1999, img: "https://vignette.wikia.nocookie.net/freefire/images/9/93/LOL_Emote.png", fallback: "😂", rare: true },
        { id: 7, name: "Red Angelic Pant", price: 2299, img: "https://vignette.wikia.nocookie.net/freefire/images/4/4c/Red_Angelic_Pants.png", fallback: "👖", rare: true },
        { id: 8, name: "Draco AK Max", price: 2899, img: "https://vignette.wikia.nocookie.net/freefire/images/e/e9/Blue_Flame_Draco.png", fallback: "🐉", rare: true },
        { id: 9, name: "Throne Emote", price: 1999, img: "https://vignette.wikia.nocookie.net/freefire/images/7/7b/Storage_Emote_Throne.png", fallback: "👑", rare: true },
        { id: 10, name: "DJ Alok Character", price: 1499, img: "https://vignette.wikia.nocookie.net/freefire/images/9/95/Alok.png", fallback: "🎧", rare: false },
        { id: 11, name: "Evo M1887 Skin", price: 1799, img: "https://vignette.wikia.nocookie.net/freefire/images/2/25/M1887_Winterlands.png", fallback: "🔫", rare: false },
        { id: 12, name: "Katana Blood", price: 999, img: "https://vignette.wikia.nocookie.net/freefire/images/1/10/Katana_Blood_Moon.png", fallback: "⚔️", rare: false }
    ];

    let currentDiamonds = 82140765;
    let selectedItem = null;
    let isPlayerVerified = false;

    const grid = document.getElementById('items-grid');
    const sendBtn = document.getElementById('send-btn');

    function renderItems() {
        grid.innerHTML = '';
        storeItems.forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card ${item.rare ? 'rare' : ''} ${selectedItem && selectedItem.id === item.id ? 'selected' : ''}`;
            card.onclick = () => selectItem(item);

            card.innerHTML = `
                ${item.rare ? '<span class="rare-tag">RARE</span>' : ''}
                <div class="item-img-box">
                    <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span style="display:none; font-size:35px;">${item.fallback}</span>
                </div>
                <div class="item-name">${item.name}</div>
                <div class="item-price">${item.price} 💎</div>
            `;
            grid.appendChild(card);
        });
    }

    function selectItem(item) {
        selectedItem = item;
        renderItems();
        updateButtonState();
    }

    function searchPlayer() {
        const uid = document.getElementById('uid-input').value.trim();
        const statusBox = document.getElementById('player-status');
        const nameEl = document.getElementById('player-name');

        if (uid.length < 5) {
            alert("Please enter a valid Free Fire UID!");
            return;
        }

        const btn = document.querySelector('.search-btn');
        btn.innerText = "SEARCHING...";
        
        setTimeout(() => {
            btn.innerText = "SEARCH";
            isPlayerVerified = true;
            statusBox.style.display = 'flex';
            nameEl.innerText = `FF_PRO_${uid.slice(-4)}`;
            updateButtonState();
        }, 800);
    }

    function updateButtonState() {
        if (selectedItem) {
            sendBtn.disabled = false;
            sendBtn.innerText = `SEND GIFT NOW (${selectedItem.price} 💎) 🎁`;
        }
    }

    function sendGift() {
        const uid = document.getElementById('uid-input').value.trim();
        if (!uid) {
            alert("Please enter Player UID first!");
            document.getElementById('uid-input').focus();
            return;
        }

        sendBtn.innerText = "SENDING GIFT...";
        sendBtn.disabled = true;

        setTimeout(() => {
            currentDiamonds -= selectedItem.price;
            document.getElementById('total-diamonds').innerText = currentDiamonds.toLocaleString();

            document.getElementById('modal-message').innerHTML = `
                Item <strong>${selectedItem.name}</strong> has been sent to UID: <strong>${uid}</strong>.<br><br>
                <span style="color:#f39c12;">${selectedItem.price} Diamonds deducted!</span>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';

            selectedItem = null;
            renderItems();
            sendBtn.innerText = "SELECT AN ITEM FIRST";
        }, 1200);
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    renderItems();
</script>

</body>
</html>
