<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BD Bus Simulator Pro - Dhaka Route</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #0f172a; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Top HUD & Minimap */
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        .hud-box {
            background: rgba(15, 23, 42, 0.85); color: #fff;
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px; backdrop-filter: blur(4px);
        }
        .hud-title { color: #facc15; font-weight: bold; font-size: 12px; }
        .bar-container { width: 100px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-top: 3px; }
        .bar-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }
        
        /* Minimap Canvas */
        #minimap-canvas {
            width: 110px; height: 110px; background: rgba(15, 23, 42, 0.9);
            border: 2px solid #facc15; border-radius: 50%; pointer-events: auto;
        }

        #warning-msg {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.95); color: #fff; padding: 5px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold;
            opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 15;
            white-space: nowrap;
        }

        /* Two-Hand Controls (Steering on Left, Pedals on Right) */
        #controls {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none; z-index: 10;
        }
        
        /* Steering Wheel UI */
        #steering-container {
            width: 150px; height: 150px; pointer-events: auto;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        #steering-wheel {
            width: 130px; height: 130px; border-radius: 50%;
            background: rgba(30, 41, 59, 0.85); border: 5px solid #64748b;
            position: absolute; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transform-origin: center;
        }
        #steering-inner {
            width: 36px; height: 36px; border-radius: 50%; background: #facc15;
            display: flex; align-items: center; justify-content: center; font-size: 14px; color: #000; font-weight: bold;
        }
        #steering-bar1 { position: absolute; width: 110px; height: 6px; background: #64748b; }
        #steering-bar2 { position: absolute; width: 6px; height: 55px; background: #64748b; top: 65px; }

        /* Right Pedals & Actions */
        .right-group { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
        .action-btns { display: flex; flex-direction: column; gap: 6px; }
        .mini-btn {
            background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid #facc15;
            padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .pedal {
            width: 58px; height: 85px; border-radius: 10px; color: #fff; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.3);
        }
        #btn-gas { background: rgba(34, 197, 94, 0.85); border-color: #22c55e; }
        #btn-brake { background: rgba(239, 68, 68, 0.85); border-color: #ef4444; }
        .pedal:active { transform: scale(0.94); filter: brightness(1.2); }

        /* Game Over Modal */
        #game-over {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; z-index: 30; text-align: center; padding: 20px;
        }
        #restart-btn {
            background: #facc15; color: #000; border: none; padding: 10px 24px;
            font-size: 15px; font-weight: bold; border-radius: 8px; margin-top: 12px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-box">
            <div class="hud-title">আরিফ পরিবহন (Pro)</div>
            <div>গতি: <span id="speed-val">0</span> km/h | দূরত্ব: <span id="dist-val">0.0</span> km</div>
            <div style="margin-top:2px;">ড্যামেজ:</div>
            <div class="bar-container"><div id="health-bar" class="bar-fill"></div></div>
            <div style="margin-top:2px;">ফুয়েল:</div>
            <div class="bar-container"><div id="fuel-bar" class="bar-fill" style="background:#38bdf8;"></div></div>
        </div>
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="warning-msg">⚠️ সতর্কবার্তা!</div>

    <div id="controls">
        <!-- Two-hand Steering Wheel -->
        <div id="steering-container">
            <div id="steering-wheel">
                <div id="steering-bar1"></div>
                <div id="steering-bar2"></div>
                <div id="steering-inner">🛞</div>
            </div>
        </div>

        <div class="right-group">
            <div class="action-btns">
                <button class="mini-btn" id="btn-horn">📯 হর্ন</button>
                <button class="mini-btn" id="btn-cam">📷 ক্যামেরা</button>
            </div>
            <div class="pedal" id="btn-brake">🛑<span>ব্রেক</span></div>
            <div class="pedal" id="btn-gas">🚀<span>গ্যাস</span></div>
        </div>
    </div>

    <div id="game-over">
        <h1 id="go-title" style="color:#ef4444; font-size:26px;">গেম ওভার!</h1>
        <p id="go-desc" style="margin-top:6px; font-size:14px; color:#cbd5e1;"></p>
        <button id="restart-btn" onclick="location.reload()">পুনরায় খেলুন</button>
    </div>
</div>

<script>
    // --- Textures & Visual Helpers ---
    function createBusBackTexture() {
        const c = document.createElement('canvas'); c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#facc15'; ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(40, 35, 432, 130);
        ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.roundRect(65, 190, 382, 85, 16); ctx.fill();
        ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 6; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 54px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('আরিফ', 256, 250);
        ctx.fillStyle = '#dc2626'; ctx.fillRect(20, 390, 472, 95);
        return new THREE.CanvasTexture(c);
    }

    let audioCtx = null;
    function playHorn() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [320, 400, 480].forEach(f => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.45);
        });
    }

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd6d3c9);
    scene.fog = new THREE.FogExp2(0xd6d3c9, 0.005);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 350);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('game-container').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xfffbeb, 0x475569, 0.85));
    const sun = new THREE.DirectionalLight(0xfff7ed, 0.9); sun.position.set(35, 70, 25); scene.add(sun);

    // --- Player Bus ---
    const playerBus = new THREE.Group();
    const busMat = [
        new THREE.MeshStandardMaterial({ color: 0xfacc15 }),
        new THREE.MeshStandardMaterial({ color: 0xfacc15 }),
        new THREE.MeshStandardMaterial({ color: 0xfacc15 }),
        new THREE.MeshStandardMaterial({ color: 0xfacc15 }),
        new THREE.MeshStandardMaterial({ map: createBusBackTexture() }),
        new THREE.MeshStandardMaterial({ color: 0xfacc15 })
    ];
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.55, 2.75, 9.2), busMat);
    body.position.y = 1.75; body.castShadow = true; playerBus.add(body);
    
    // Skirt & Windows
    const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.58, 0.55, 9.22), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
    skirt.position.y = 0.85; playerBus.app ? null : playerBus.add(skirt);
    scene.add(playerBus);

    // --- Road & Sidewalks ---
    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(22, 1000),
        new THREE.MeshStandardMaterial({ color: 0x3b4048, roughness: 0.85 })
    );
    road.rotation.x = -Math.PI / 2; road.position.z = -400; road.receiveShadow = true; scene.add(road);

    const leftWalk = new THREE.Mesh(new THREE.BoxGeometry(9, 0.25, 1000), new THREE.MeshStandardMaterial({ color: 0xd6d3d1 }));
    leftWalk.position.set(-15.5, 0.12, -400); scene.add(leftWalk);
    const rightWalk = new THREE.Mesh(new THREE.BoxGeometry(9, 0.25, 1000), new THREE.MeshStandardMaterial({ color: 0xd6d3d1 }));
    rightWalk.position.set(15.5, 0.12, -400); scene.add(rightWalk);

    // --- Environment, Fuel Stations & Repair Shops ---
    const envGroup = new THREE.Group(); scene.add(envGroup);
    const stations = []; // Stores Fuel & Repair checkpoints

    for (let z = 20; z > -600; z -= 30) {
        // Divider line
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 30), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
        line.rotation.x = -Math.PI / 2; line.position.set(0, 0.02, z); envGroup.add(line);

        // Buildings
        const b = new THREE.Mesh(new THREE.BoxGeometry(10, 16, 20), new THREE.MeshStandardMaterial({ color: 0x64748b }));
        b.position.set(-22, 8, z); envGroup.add(b);

        // Fuel Station or Repair Shop every 150m
        if (Math.abs(z) % 150 === 0 && z !== 0) {
            const isFuel = Math.abs(z) % 300 === 0;
            const stMesh = new THREE.Mesh(
                new THREE.BoxGeometry(5, 4, 8),
                new THREE.MeshStandardMaterial({ color: isFuel ? 0x0284c7 : 0x16a34a })
            );
            stMesh.position.set(13.2, 2, z);
            envGroup.add(stMesh);
            stations.push({ type: isFuel ? 'fuel' : 'repair', z: z, mesh: stMesh });
        }
    }

    // --- Traffic & Hazards ---
    const traffic = [];
    for (let z = -50; z > -550; z -= 45) {
        const v = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 2.5, 7.5),
            new THREE.MeshStandardMaterial({ color: 0x2563eb })
        );
        v.position.set(Math.random() > 0.5 ? 3.5 : 7.5, 1.25, z);
        v.userData = { speed: 0.25 + Math.random() * 0.15, w: 2.2, l: 7.5 };
        scene.add(v);
        traffic.push(v);
    }

    // --- Game Physics & Controls ---
    let speed = 0, busX = 4.5, distance = 0, health = 100, fuel = 100;
    let isGameOver = false, cameraMode = 0, shakeTimer = 0;
    const input = { gas: false, brake: false };
    let steeringAngle = 0;

    // Steering Wheel Drag Mechanics
    const steeringWheel = document.getElementById('steering-wheel');
    let isSteering = false, startAngle = 0, currentRotation = 0;

    steeringWheel.addEventListener('touchstart', (e) => { isSteering = true; });
    window.addEventListener('touchmove', (e) => {
        if (!isSteering) return;
        const touch = e.touches[0];
        const rect = steeringWheel.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const rad = Math.atan2(touch.clientY - cy, touch.clientX - cx);
        currentRotation = rad * (180 / Math.PI);
        steeringWheel.style.transform = `rotate(${currentRotation}deg)`;
        steeringAngle = Math.max(-1, Math.min(1, currentRotation / 60));
    });
    window.addEventListener('touchend', () => {
        isSteering = false; steeringAngle = 0; steeringWheel.style.transform = `rotate(0deg)`;
    });

    // Pedals
    function bindPedal(id, key) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
        el.addEventListener('mousedown', () => input[key] = true);
        el.addEventListener('mouseup', () => input[key] = false);
    }
    bindPedal('btn-gas', 'gas'); bindPedal('btn-brake', 'brake');

    document.getElementById('btn-horn').addEventListener('click', playHorn);
    document.getElementById('btn-cam').addEventListener('click', () => cameraMode = cameraMode === 0 ? 1 : 0);

    const warningEl = document.getElementById('warning-msg');
    let warnTimer;
    function warn(msg) {
        warningEl.innerText = msg; warningEl.style.opacity = 1;
        clearTimeout(warnTimer); warnTimer = setTimeout(() => warningEl.style.opacity = 0, 1500);
    }

    function triggerGameOver(title, desc) {
        isGameOver = true;
        document.getElementById('go-title').innerText = title;
        document.getElementById('go-desc').innerText = desc;
        document.getElementById('game-over').style.display = 'flex';
    }

    // --- Minimap Renderer ---
    const mapCanvas = document.getElementById('minimap-canvas');
    const mapCtx = mapCanvas.getContext('2d');
    function drawMinimap() {
        mapCtx.clearRect(0, 0, 110, 110);
        mapCtx.fillStyle = '#334155'; mapCtx.fillRect(45, 0, 20, 110); // Road
        // Player
        mapCtx.fillStyle = '#facc15'; mapCtx.fillRect(50 + busX * 2, 85, 8, 12);
        // Stations & Traffic on map
        stations.forEach(st => {
            const mapY = 55 + (st.mesh.position.z + distance * 50) * 0.15;
            if (mapY >= 0 && mapY <= 110) {
                mapCtx.fillStyle = st.type === 'fuel' ? '#38bdf8' : '#22c55e';
                mapCtx.fillRect(75, mapY, 6, 6);
            }
        });
    }

    // --- Main Loop ---
    function animate() {
        requestAnimationFrame(animate);
        if (isGameOver) return;

        // Fuel consumption
        if (speed > 0.05) {
            fuel = Math.max(0, fuel - 0.008);
            document.getElementById('fuel-bar').style.width = fuel + '%';
            if (fuel <= 0) { triggerGameOver('গাড়িতে ফুয়েল শেষ!', 'ফুয়েল পাম্পে না থামার কারণে গাড়ি আটকে গেছে।'); return; }
        }

        if (input.gas) speed = Math.min(1.15, speed + 0.012);
        else if (input.brake) speed = Math.max(0, speed - 0.035);
        else speed = Math.max(0, speed - 0.004);

        if (Math.abs(steeringAngle) > 0.05) {
            busX -= steeringAngle * 0.18 * (0.4 + speed);
        }
        
        // Out of bounds damage check
        if (Math.abs(busX) > 9.2) {
            health = Math.max(0, health - 0.5);
            warn('⚠️ রাস্তার বাইরে চলে গেছেন! ড্যামেজ হচ্ছে');
        }
        busX = Math.max(-10, Math.min(10, busX));
        playerBus.position.x = busX;

        distance += speed * 0.015;
        const currentSpeedKmh = Math.round(speed * 90);
        document.getElementById('speed-val').innerText = currentSpeedKmh;
        document.getElementById('dist-val').innerText = distance.toFixed(2);

        envGroup.children.forEach(o => {
            o.position.z += speed;
            if (o.position.z > 30) o.position.z -= 600;
        });

        stations.forEach(st => {
            st.mesh.position.z += speed;
            if (Math.abs(st.mesh.position.z) < 3 && Math.abs(st.mesh.position.x - busX) < 4) {
                if (st.type === 'fuel') { fuel = 100; document.getElementById('fuel-bar').style.width = '100%'; warn('⛽ ফুল ফুয়েল রিফ্লেক্স করা হয়েছে!'); }
                else { health = 100; document.getElementById('health-bar').style.width = '100%'; warn('🔧 গাড়ি পুরোপুরি রিপেয়ার করা হয়েছে!'); }
            }
            if (st.mesh.position.z > 30) st.mesh.position.z = -550;
        });

        traffic.forEach(v => {
            v.position.z += (speed - v.userData.speed);
            const dz = Math.abs(v.position.z);
            const dx = Math.abs(v.position.x - busX);
            if (dz < 4.8 && dx < 2.0) {
                if (currentSpeedKmh > 30) {
                    triggerGameOver('দুর্ঘটনা ঘটেছে!', `৩০ কিমি/ঘণ্টার বেশি (${currentSpeedKmh} km/h) গতিতে গাড়িতে ধাক্কা লেগেছে!`);
                } else {
                    health = Math.max(0, health - 15);
                    warn('💥 হালকা ধাক্কা লেগেছে!');
                    speed = 0.05; v.position.z -= 10;
                    document.getElementById('health-bar').style.width = health + '%';
                    if (health <= 0) triggerGameOver('গাড়ি ধ্বংস হয়ে গেছে!', 'ড্যামেজ বেশি হওয়ায় গাড়ি আর সচল নেই।');
                }
            }
            if (v.position.z > 30 || v.position.z < -620) v.position.z = -520 - Math.random() * 80;
        });

        drawMinimap();

        let sx = 0, sy = 0;
        if (shakeTimer > 0) { sx = (Math.random() - 0.5) * 0.2; sy = (Math.random() - 0.5) * 0.2; shakeTimer--; }

        if (cameraMode === 0) {
            camera.position.set(busX * 0.85 + sx, 6.2 + sy, 12.2);
            camera.lookAt(busX, 1.8, -16);
        } else {
            camera.position.set(busX - 0.6 + sx, 2.6 + sy, -3.5);
            camera.lookAt(busX - 0.6, 2.0, -35);
        }
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
</script>
</body>
</html>
